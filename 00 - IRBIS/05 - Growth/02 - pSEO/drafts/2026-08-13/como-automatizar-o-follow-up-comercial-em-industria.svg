    <rect x="625" y="390" width="350" height="220" rx="12" fill="#d3ddd3"/>
    <text x="660" y="458" fill="#153b36" font-size="28">PROPOSTA ENVIADA</text>
    <text x="660" y="510" fill="#153b36" font-size="40">Histórico</text>
