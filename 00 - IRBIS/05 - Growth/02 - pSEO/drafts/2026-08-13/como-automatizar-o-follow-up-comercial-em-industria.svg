<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">como automatizar o follow-up comercial em indústria</title>
  <desc id="desc">Diagrama de oportunidades comerciais industriais organizadas por responsável, prazo e próxima ação.</desc>
  <rect width="1600" height="900" fill="#f1f0e9"/>
  <rect x="100" y="110" width="1400" height="680" rx="20" fill="#153b36"/>
  <text x="180" y="230" fill="#f1f0e9" font-family="Georgia, serif" font-size="64">Follow-up comercial</text>
  <text x="184" y="292" fill="#b9c7bd" font-family="Helvetica, sans-serif" font-size="30">Indústria: responsável, prazo e próxima ação</text>
  <g font-family="Helvetica, sans-serif">
    <rect x="180" y="390" width="350" height="220" rx="12" fill="#e6a95a"/>
    <text x="215" y="458" fill="#153b36" font-size="28">ORÇAMENTO</text>
    <text x="215" y="510" fill="#153b36" font-size="40">Responsável</text>
