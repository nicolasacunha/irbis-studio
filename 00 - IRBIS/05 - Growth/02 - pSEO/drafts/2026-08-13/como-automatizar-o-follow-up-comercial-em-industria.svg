    <text x="1105" y="560" fill="#153b36" font-size="28">Mensagem conferida</text>
  </g>
  <path d="M535 500h80m360 0h80" stroke="#e6a95a" stroke-width="12" stroke-linecap="round"/>
  <circle cx="600" cy="500" r="15" fill="#e6a95a"/><circle cx="1045" cy="500" r="15" fill="#e6a95a"/>
