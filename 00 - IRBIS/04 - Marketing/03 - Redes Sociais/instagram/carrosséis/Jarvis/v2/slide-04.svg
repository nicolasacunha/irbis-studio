<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#f5efe5"/><rect x="28" y="28" width="1024" height="1294" fill="none" stroke="#202020" stroke-width="2"/><text x="70" y="75" font-family="Helvetica Neue,sans-serif" font-size="20">O JARVIS OS</text><text x="970" y="75" font-family="Helvetica Neue,sans-serif" font-size="20">04</text><path d="M70 92H1010" stroke="#222"/><text x="90" y="265" font-family="Georgia,serif" font-size="150">As 4 partes</text><text x="88" y="420" font-family="Georgia,serif" font-size="150" fill="#2867b8">do sistema</text><path d="M100 460q300-18 700 0" stroke="#171717" stroke-width="8" fill="none"/><g stroke="#222" fill="#f5efe5"><rect x="110" y="550" width="860" height="570"/><path d="M110 660h860M110 775h860M110 890h860M350 550v570"/></g><g font-family="monospace" font-size="28" text-anchor="middle"><text x="230" y="620">PARTE</text><text x="660" y="620">O QUE FAZ</text><text x="230" y="735" font-weight="700">Claude Code</text><text x="660" y="705">O motor. Roteia cada pedido</text><text x="660" y="740">para a habilidade certa.</text><text x="230" y="850" font-weight="700">Obsidian</text><text x="660" y="820">A memória. Tudo vira</text><text x="660" y="855">markdown conectado.</text><text x="230" y="965" font-weight="700">Voz local</text><text x="660" y="935">Ouvidos + boca.</text><text x="660" y="970">Privado por padrão.</text><text x="230" y="1075" font-weight="700">HUD único</text><text x="660" y="1045">O rosto. Uma tela para</text><text x="660" y="1080">dados, agenda e comandos.</text></g><g transform="translate(650 1190) rotate(-4)"><path d="M-180 0q150-30 350 0" fill="none" stroke="#222" stroke-width="3"/><text x="-120" y="45" font-family="cursive" font-size="29">Foque na fiação.</text><text x="-105" y="82" font-family="cursive" font-size="29">Não no trabalho manual.</text></g><text x="75" y="1280" font-family="monospace" font-size="18">MENTALIDADE: FALE. ROTEIE. LEMBRE. REPITA.</text></svg>
