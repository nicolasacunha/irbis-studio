<text x="44" y="92" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="7" fill="#2365b8">03 + 04 / TESTE E DEIXE RODAR</text>
<text x="40" y="260" font-family="Georgia,serif" font-size="110" fill="#1e1e1e">Feche o ciclo.</text>
<text x="40" y="376" font-family="Georgia,serif" font-size="110" fill="#2365b8">Acompanhe.</text>
<text x="46" y="490" font-family="Arial,sans-serif" font-size="32" fill="#3b3b3b">Teste com casos reais. Ajuste o que falhar.</text>
<text x="46" y="535" font-family="Arial,sans-serif" font-size="32" fill="#3b3b3b">Depois, conecte ao ritmo do seu dia.</text>
