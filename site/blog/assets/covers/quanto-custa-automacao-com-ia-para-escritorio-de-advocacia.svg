  <text x="112" y="140" fill="#f5f0df" font-family="Georgia, serif" font-size="66">Automação com IA</text>
  <text x="117" y="200" fill="#bdc58b" font-family="system-ui, sans-serif" font-size="32">rotina · dados de cliente · sigilo · revisão humana</text>
  <text x="112" y="812" fill="#f5f0df" font-family="system-ui, sans-serif" font-size="38">quanto custa automação com IA para escritório de advocacia</text>
</svg>
