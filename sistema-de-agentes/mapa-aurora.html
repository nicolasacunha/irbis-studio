  :root {
    --void: #100f0b;
    --tinta: #201f1a;

    --suave: #8a8878;

    --salvia-bright: #93b382;
    --alerta: #b4552d;
    --alerta-bright: #e08a5c;
    --linha: color-mix(in srgb, var(--papel) 14%, transparent);

    --font-sans: "Archivo", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;

  // Layout: posiciona nós dept + brain, desenha raízes (SVG) conectando
  // ---------------------------------------------------------------------
  var stage = document.getElementById("stage");
  var rootsSvg = document.getElementById("roots");

  // Em telas estreitas/altas o raio precisa encolher e o centro descer, senão a
  // árvore "Vendas" (mais perto do topo) fica embaixo do H1. Recalcula no resize.
  function radialParams() {
    var narrow = window.innerWidth <= 720;
    return narrow ? { maxR: 30, centerY: 60 } : { maxR: 44, centerY: 50 };
  }

  function polarToPercent(angleDeg, radiusFrac, params) {
    var rad = (angleDeg - 90) * (Math.PI / 180);
    var r = radiusFrac * params.maxR;
    return {
      x: 50 + r * Math.cos(rad),
      y: params.centerY + r * Math.sin(rad)
    };
  }

  var brainBtn = document.createElement("button");
  brainBtn.className = "brain-node first-look";
  brainBtn.setAttribute("aria-haspopup", "dialog");
  brainBtn.innerHTML =
    '<span class="brain-core"><span class="glow"></span><span class="ring r2"></span><span class="ring"></span><span class="core"></span></span>' +
    '<span class="brain-label">Company Brain</span>';
  brainBtn.addEventListener("click", function () { openDrawer("brain"); });
  stage.appendChild(brainBtn);

  var nodeEls = {};

  function repositionNodes() {
    var params = radialParams();
    DEPARTMENTS.forEach(function (dept) {
      var pos = polarToPercent(dept.angle, dept.radius, params);
      dept._pos = pos;
      var el = nodeEls[dept.id];
      if (el) {
        el.style.left = pos.x + "%";
        el.style.top = pos.y + "%";
      }
    });
  }

  DEPARTMENTS.forEach(function (dept, i) {
    var pos = polarToPercent(dept.angle, dept.radius, radialParams());
    dept._pos = pos;

    var btn = document.createElement("button");
    btn.className = "tree-node";
    btn.style.left = pos.x + "%";
    btn.style.top = pos.y + "%";
    btn.setAttribute("aria-pressed", "false");
    btn.setAttribute("aria-label", dept.name + " — " + dept.jobs.length + " jobs");

    var canvas = document.createElement("canvas");
    var size = 92;
    canvas.width = size * 2;
    canvas.height = size * 2;
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    drawNeuron(canvas.getContext("2d"), size * 2, dept, i);

    var nameEl = document.createElement("span");
    nameEl.className = "tree-name";
    nameEl.textContent = dept.name;

    var countEl = document.createElement("span");
    countEl.className = "tree-count";
    var gaps = dept.jobs.filter(function (j) { return !j.skill; }).length;
    countEl.textContent = dept.jobs.length + " jobs · " + gaps + " sem skill";

    btn.appendChild(canvas);
    btn.appendChild(nameEl);
    btn.appendChild(countEl);
    btn.addEventListener("click", function () { openDrawer(dept.id); });

    stage.appendChild(btn);
    nodeEls[dept.id] = btn;
  });

  function drawRoots() {
    var rect = stage.getBoundingClientRect();
    rootsSvg.setAttribute("viewBox", "0 0 " + rect.width + " " + rect.height);
    var svgns = "http://www.w3.org/2000/svg";
    while (rootsSvg.firstChild) rootsSvg.removeChild(rootsSvg.firstChild);
    DEPARTMENTS.forEach(function (dept) {
      var x1 = rect.width * 0.5, y1 = rect.height * 0.5;
      var x2 = (dept._pos.x / 100) * rect.width, y2 = (dept._pos.y / 100) * rect.height;
      var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      var dx = x2 - x1, dy = y2 - y1;
      var nx = -dy, ny = dx;
      var norm = Math.sqrt(nx * nx + ny * ny) || 1;
      var bend = 26;
      var cx = mx + (nx / norm) * bend;
      var cy = my + (ny / norm) * bend;
      var path = document.createElementNS(svgns, "path");
      path.setAttribute("d", "M " + x1 + " " + y1 + " Q " + cx + " " + cy + " " + x2 + " " + y2);
      rootsSvg.appendChild(path);
    });
  }
  drawRoots();
  window.addEventListener("resize", drawRoots);

  // ---------------------------------------------------------------------
  // Árvore procedural por departamento (canvas, seed determinística)
  // ---------------------------------------------------------------------
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashSeed(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) | 0; }
    return h;
  }

  function levelColor(level) {
    if (level === "ai") return "147, 179, 130";
    if (level === "human") return "224, 138, 92";
    return "138, 136, 120";
  }

  // Cada departamento é um neurônio, não uma árvore de jardim — soma no centro,
  // dendritos finos e curvos saindo dele, terminais sinápticos nas pontas. Job com
  // skill = sinapse acesa (brilha, cor do nível de automação); sem skill = terminal
  // apagado (contorno fraco, sem luz). Reskin pedido pelo Nicolas 05/ago: "muito
  // árvore, pouco sistema neural".
  function drawNeuron(ctx, size, dept, seedIndex) {
    var rand = mulberry32(hashSeed(dept.id) + seedIndex * 97);
    var baseX = size / 2;
    var baseY = size * 0.92;
    ctx.clearRect(0, 0, size, size);
    ctx.lineCap = "round";

    var jobs = dept.jobs.slice();
    var maxDepth = 4;
    var trunkLen = size * 0.24;

    function drawSynapse(x, y, job) {
      if (job.skill) {
        var col = levelColor(job.level);
        var r = size * 0.02;
        var glow = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
        glow.addColorStop(0, "rgba(" + col + ", 0.5)");
        glow.addColorStop(1, "rgba(" + col + ", 0)");
        ctx.beginPath();
        ctx.arc(x, y, r * 3, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(" + col + ", 0.95)";
        ctx.fill();
      } else {
        // terminal sem conexão — a sinapse que ainda não existe
        ctx.beginPath();
        ctx.arc(x, y, size * 0.017, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(224, 138, 92, 0.5)";
        ctx.lineWidth = size * 0.0035;
        ctx.stroke();
      }
    }

    function branch(x, y, angle, len, depth, jobIdx) {
      if (depth > maxDepth || len < size * 0.025) {
        if (jobIdx < jobs.length) drawSynapse(x, y, jobs[jobIdx]);
        return jobIdx + 1;
      }
      var x2 = x + Math.cos(angle) * len;
      var y2 = y + Math.sin(angle) * len;
      // leve curvatura — dendrito, não graveto reto
      var bow = angle + (Math.PI / 2) * (rand() > 0.5 ? 1 : -1);
      var mx = (x + x2) / 2 + Math.cos(bow) * len * 0.12 * rand();
      var my = (y + y2) / 2 + Math.sin(bow) * len * 0.12 * rand();
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(mx, my, x2, y2);
      ctx.strokeStyle = "rgba(230, 229, 225, " + (0.4 - depth * 0.05) + ")";
      ctx.lineWidth = Math.max(0.75, size * 0.01 * (1 - depth / (maxDepth + 1)));
      ctx.stroke();

      var branches = depth === 0 ? 2 : (rand() > 0.22 ? 2 : 1);
      var nextIdx = jobIdx;
      for (var b = 0; b < branches; b++) {
        var spread = 0.4 + rand() * 0.34;
        var dir = b % 2 === 0 ? -1 : 1;
        var newAngle = angle + dir * spread * (0.6 + rand() * 0.6);
        var newLen = len * (0.66 + rand() * 0.14);
        nextIdx = branch(x2, y2, newAngle, newLen, depth + 1, nextIdx);
      }
      return nextIdx;
    }

    // soma — o corpo central de onde os dendritos saem
    ctx.beginPath();
    ctx.ellipse(baseX, baseY, size * 0.032, size * 0.024, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(230, 229, 225, 0.16)";
    ctx.fill();
    ctx.strokeStyle = "rgba(230, 229, 225, 0.4)";
    ctx.lineWidth = size * 0.006;
    ctx.stroke();

    var drawn = branch(baseX, baseY, -Math.PI / 2, trunkLen, 0, 0);
    // Rede de segurança: a recursão estocástica não garante um terminal por job. Se
    // sobrar job sem terminal, ele ainda aparece — senão a contagem no rótulo mente
    // sobre o que o neurônio mostra (crítica de design 05/ago).
    for (var i = drawn; i < jobs.length; i++) {
      var k = i - drawn;
      var bx = baseX + (k % 2 === 0 ? 1 : -1) * size * (0.08 + Math.floor(k / 2) * 0.05);
      var by = baseY + size * 0.02;
      drawSynapse(bx, by, jobs[i]);
    }
  }

  // ---------------------------------------------------------------------
  // Drawer
  // ---------------------------------------------------------------------
  var scrim = document.getElementById("scrim");
  var drawer = document.getElementById("drawer");
  var drawerEyebrow = document.getElementById("drawerEyebrow");
  var drawerTitle = document.getElementById("drawerTitle");
  var drawerDesc = document.getElementById("drawerDesc");
  var drawerBody = document.getElementById("drawerBody");
  var drawerCloseBtn = document.getElementById("drawerClose");
  var activeId = null;

  function openDrawer(id) {
    activeId = id;
    Object.keys(nodeEls).forEach(function (k) {
      nodeEls[k].setAttribute("aria-pressed", String(k === id));
      // Trocar direto de departamento com a gaveta aberta continua funcionando
      // (mouse "atravessa" o scrim de propósito); o que faltava era o resto do
      // mapa recuar visualmente enquanto isso, que é o que o scrim promete.
      nodeEls[k].classList.toggle("dimmed", k !== id);
    });

    if (id === "brain") {
      drawerEyebrow.textContent = BRAIN.eyebrow;
      drawerTitle.textContent = BRAIN.name;
      drawerDesc.textContent = BRAIN.desc;
      drawerBody.innerHTML = "";
      BRAIN.facts.forEach(function (f) {
        var row = document.createElement("div");
        row.className = "brain-fact";
        row.innerHTML = '<span class="k">' + f.k + '</span><span class="v">' + f.v + "</span>";
        drawerBody.appendChild(row);
      });
    } else {
      var dept = DEPARTMENTS.filter(function (d) { return d.id === id; })[0];
      drawerEyebrow.textContent = "Departamento";
      drawerTitle.textContent = dept.name;
      drawerDesc.textContent = dept.tagline;
      drawerBody.innerHTML = "";
      dept.jobs.forEach(function (job) {
        var row = document.createElement("div");
        row.className = "job-row";
        var pillClass = "pill " + job.level;
        var skillText = job.skill ? job.skill : "Sem skill — a construir";
        row.innerHTML =
          '<div class="job-top"><span class="job-title">' + job.title + '</span>' +
          '<span class="' + pillClass + '">' + LEVEL_LABEL[job.level] + "</span></div>" +
          '<span class="job-skill' + (job.skill ? "" : " gap") + '">' + skillText + "</span>";
        drawerBody.appendChild(row);
      });
    }

    scrim.classList.add("open");
    drawer.classList.add("open");
    drawerCloseBtn.focus();
  }

  function closeDrawer() {
    scrim.classList.remove("open");
    drawer.classList.remove("open");
    if (activeId && nodeEls[activeId]) nodeEls[activeId].setAttribute("aria-pressed", "false");
    Object.keys(nodeEls).forEach(function (k) { nodeEls[k].classList.remove("dimmed"); });
    activeId = null;
  }

  drawerCloseBtn.addEventListener("click", closeDrawer);
  scrim.addEventListener("click", closeDrawer);
  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeDrawer();
  });

  // ---------------------------------------------------------------------
  // Aurora — canvas de fundo, faixas orgânicas em sálvia/terracota
  // ---------------------------------------------------------------------
  var auroraCanvas = document.getElementById("aurora");
  var actx = auroraCanvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w, h, t = 0;

  function resizeAurora() {
    var rect = stage.getBoundingClientRect();
    w = rect.width; h = rect.height;
    auroraCanvas.width = w * dpr;
    auroraCanvas.height = h * dpr;
    actx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeAurora();
  window.addEventListener("resize", function () { resizeAurora(); repositionNodes(); drawRoots(); });

  if (reduceMotion) {
    brainBtn.classList.remove("first-look");
  } else {
    setTimeout(function () { brainBtn.classList.remove("first-look"); }, 4000);
  }

  var bands = [
    { hue: "74, 93, 67", amp: 0.09, speed: 0.00005, yBase: 0.2, thickness: 0.34, phase: 0, freq: 1.15 },
    { hue: "180, 87, 61", amp: 0.07, speed: 0.000035, yBase: 0.5, thickness: 0.3, phase: 2.4, freq: 0.85 },
    { hue: "74, 93, 67", amp: 0.06, speed: 0.00006, yBase: 0.72, thickness: 0.26, phase: 5.1, freq: 1.4 }
  ];

  function smoothPath(ctx2, pts) {
    ctx2.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length - 1; i++) {
      var mx = (pts[i][0] + pts[i + 1][0]) / 2;
      var my = (pts[i][1] + pts[i + 1][1]) / 2;
      ctx2.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    var last = pts[pts.length - 1];
    ctx2.lineTo(last[0], last[1]);
  }

  function drawAuroraFrame(time) {
    actx.clearRect(0, 0, w, h);
    var bg = actx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, "#100f0b");
    bg.addColorStop(0.5, "#14130e");
    bg.addColorStop(1, "#181712");
    actx.fillStyle = bg;
    actx.fillRect(0, 0, w, h);

    actx.save();
    actx.filter = "blur(" + Math.max(24, w * 0.035) + "px)";

    bands.forEach(function (band) {
      var steps = 22;
      var topPts = [], botPts = [];
      for (var i = 0; i <= steps; i++) {
        var x = (i / steps) * w * 1.14 - w * 0.07;
        var wobble =
          Math.sin((i / steps) * Math.PI * band.freq + time * band.speed + band.phase) * h * band.amp +
          Math.sin((i / steps) * Math.PI * band.freq * 2.3 + time * band.speed * 1.6) * h * band.amp * 0.25;
        var y = h * band.yBase + wobble;
        topPts.push([x, y]);
        botPts.push([x, y + h * band.thickness]);
      }
      actx.beginPath();
      smoothPath(actx, topPts);
      for (i = botPts.length - 1; i >= 0; i--) actx.lineTo(botPts[i][0], botPts[i][1]);
      actx.closePath();
      var grad = actx.createLinearGradient(0, h * band.yBase, 0, h * (band.yBase + band.thickness));
      grad.addColorStop(0, "rgba(" + band.hue + ", 0.22)");
      grad.addColorStop(0.55, "rgba(" + band.hue + ", 0.1)");
      grad.addColorStop(1, "rgba(" + band.hue + ", 0)");
      actx.fillStyle = grad;
      actx.fill();
    });

    actx.restore();

    // véu de estrelas fixas, sutil
    if (!auroraCanvas._stars) {
      var stars = [];
      var starRand = mulberry32(7);
      for (var s = 0; s < 90; s++) {
        stars.push([starRand() * w, starRand() * h * 0.75, starRand() * 1.3 + 0.3, starRand() * 0.5 + 0.15]);
      }
      auroraCanvas._stars = stars;
    }
    actx.save();
    auroraCanvas._stars.forEach(function (st) {
      actx.beginPath();
      actx.arc(st[0], st[1], st[2], 0, Math.PI * 2);
      actx.fillStyle = "rgba(230, 229, 225, " + st[3] + ")";
      actx.fill();
    });
    actx.restore();
  }

  var rafId;
  function tick(time) {
    drawAuroraFrame(time);
    if (!reduceMotion) rafId = requestAnimationFrame(tick);
  }
  if (reduceMotion) {
    drawAuroraFrame(0);
  } else {
    rafId = requestAnimationFrame(tick);
  }
})();

</script>
