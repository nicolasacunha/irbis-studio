<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#f5efe5"/><rect x="28" y="28" width="1024" height="1294" fill="none" stroke="#202020" stroke-width="2"/><text x="70" y="75" font-family="Helvetica Neue,sans-serif" font-size="20">O JARVIS OS</text><text x="970" y="75" font-family="Helvetica Neue,sans-serif" font-size="20">05</text><path d="M70 92H1010" stroke="#222"/><text x="85" y="220" font-family="Georgia,serif" font-size="90" fill="#2867b8">Etapa 1:</text><text x="85" y="355" font-family="Georgia,serif" font-size="105">Conecte o cérebro</text><path d="M100 392q300-18 650 0" stroke="#171717" stroke-width="8" fill="none"/><g font-family="monospace" font-size="26"><text x="150" y="545" fill="#2867b8" font-weight="700">O QUE É:</text><text x="150" y="595">Claude Code + uma pasta de skills.</text><text x="150" y="640">Cada skill = um SKILL.md.</text><text x="150" y="685">Só entra em cena quando precisa.</text><text x="150" y="820" fill="#2867b8" font-weight="700">PRIMEIRAS HABILIDADES:</text><text x="150" y="870">metrics — puxa os números</text><text x="150" y="915">inbox — briefing da manhã</text><text x="150" y="960">trends — lê o que mudou</text><text x="150" y="1005">plan — escreve as prioridades</text><text x="150" y="1050">vault — lê + grava memória</text></g><rect x="610" y="820" width="340" height="260" rx="12" fill="#202126" stroke="#111" stroke-width="4"/><g font-family="monospace" font-size="17" fill="#ca63d6"><text x="635" y="860">COMMAND DECK</text><text x="635" y="900">• METRICS PULL</text><text x="635" y="940">• INBOX BRIEF</text><text x="635" y="980">• TREND SCAN</text><text x="635" y="1020">• PLAN TODAY</text><text x="635" y="1060">• VAULT CLEAN</text></g><g transform="translate(790 485) rotate(6)"><path d="M-125 0h250v150h-250z" fill="#e9ddc7"/><text x="-95" y="58" font-family="cursive" font-size="25">Habilidades boas</text><text x="-95" y="95" font-family="cursive" font-size="25">nascem de fluxos reais.</text></g><text x="75" y="1280" font-family="monospace" font-size="18">MENTALIDADE: FALE. ROTEIE. LEMBRE. REPITA.</text></svg>
