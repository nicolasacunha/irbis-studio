<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#f5efe5"/><rect x="28" y="28" width="1024" height="1294" fill="none" stroke="#202020" stroke-width="2"/><text x="70" y="75" font-family="Helvetica Neue,sans-serif" font-size="20">O JARVIS OS</text><text x="970" y="75" font-family="Helvetica Neue,sans-serif" font-size="20">09</text><path d="M70 92H1010" stroke="#222"/><text x="155" y="235" font-family="Georgia,serif" font-size="104">Como é um dia</text><text x="270" y="355" font-family="Georgia,serif" font-size="104" fill="#2867b8">de verdade</text><path d="M210 395q300-18 650 0" stroke="#171717" stroke-width="8" fill="none"/><g font-family="monospace" font-size="22"><rect x="150" y="485" width="780" height="630" fill="none" stroke="#222" stroke-width="3"/><path d="M150 575h780M150 685h780M150 795h780M150 905h780M395 485v630" stroke="#222" stroke-dasharray="10 8"/><text x="220" y="540">HORA</text><text x="535" y="540">O QUE ACONTECE</text><text x="205" y="650">07:00</text><text x="440" y="630">“briefing da manhã”</text><text x="440" y="665">inbox, agenda e notícias</text><text x="205" y="760">09:00</text><text x="440" y="740">“planeje meu dia”</text><text x="440" y="775">as 3 prioridades caem no vault</text><text x="205" y="870">14:00</text><text x="440" y="850">“puxe as métricas”</text><text x="440" y="885">assinantes, views e sinais</text><text x="205" y="980">19:00</text><text x="440" y="960">“feche o dia”</text><text x="440" y="995">reflexão registrada. amanhã na fila.</text><text x="205" y="1085">SEMPRE</text><text x="440" y="1065">pergunte qualquer coisa.</text><text x="440" y="1100">o vault lembra de tudo.</text></g><text x="75" y="1280" font-family="monospace" font-size="18">MENTALIDADE: FALE. ROTEIE. LEMBRE. REPITA.</text></svg>
