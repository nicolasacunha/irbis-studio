<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#f5efe5"/><rect x="28" y="28" width="1024" height="1294" fill="none" stroke="#202020" stroke-width="2"/><text x="70" y="75" font-family="Helvetica Neue,sans-serif" font-size="20">O JARVIS OS</text><text x="970" y="75" font-family="Helvetica Neue,sans-serif" font-size="20">03</text><path d="M70 92H1010" stroke="#222"/><text x="90" y="265" font-family="Georgia,serif" font-size="166">Por que</text><text x="88" y="425" font-family="Georgia,serif" font-size="166" fill="#2867b8">funciona?</text><path d="M100 465q300-18 650 0" stroke="#171717" stroke-width="8" fill="none"/><g font-family="Helvetica Neue,sans-serif" font-size="33"><text x="155" y="595" fill="#2867b8" font-weight="700">ANTES:</text><text x="155" y="645">você abre cada ferramenta na mão.</text><text x="155" y="695">Abas. Digitação. Contexto perdido.</text><text x="155" y="800" fill="#2867b8" font-weight="700">DEPOIS:</text><text x="155" y="850">uma camada de voz.</text><text x="155" y="900">Fale — a habilidade certa executa.</text><text x="155" y="950">A resposta volta em voz alta.</text></g><g transform="translate(860 575)"><circle r="60" fill="none" stroke="#222" stroke-width="4"/><path d="M-35 0l25 25 50-60" fill="none" stroke="#2867b8" stroke-width="12"/><text x="0" y="145" text-anchor="middle" font-family="cursive" font-size="30">sem trocar de contexto</text></g><rect x="120" y="1040" width="840" height="150" rx="8" fill="#202126" stroke="#111" stroke-width="4"/><g font-family="monospace" font-size="24" fill="#c7df4a"><text x="150" y="1080">$ fale “planeje meu dia”</text><text x="150" y="1120" fill="#7cb5ff">→ JARVIS → habilidade → resposta</text><text x="150" y="1160" fill="#f3f0e8">o sistema segue o fluxo, não a aba.</text></g><text x="75" y="1280" font-family="monospace" font-size="18">MENTALIDADE: FALE. ROTEIE. LEMBRE. REPITA.</text></svg>
