<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">quanto custa sistema com IA para agência de marketing</title>
  <desc id="desc">Diagrama editorial de um sistema que conecta mídia, CRM, conteúdo, relatórios e revisão humana.</desc>
  <rect width="1600" height="900" fill="#edf0ea"/>
  <g fill="#183b35">
    <text x="120" y="164" font-family="Georgia, serif" font-size="70" font-weight="700">SISTEMA COM IA</text>
    <text x="124" y="232" font-family="Georgia, serif" font-size="42">para agência de marketing</text>
  </g>
  <g fill="none" stroke="#183b35" stroke-width="5">
    <path d="M290 495H575M775 495H1060"/>
    <circle cx="675" cy="495" r="104" fill="#d1dfb6"/>
    <rect x="110" y="420" width="180" height="150" rx="10"/>
    <rect x="1060" y="420" width="180" height="150" rx="10"/>
  </g>
  <g fill="#183b35" font-family="system-ui, sans-serif" font-size="29" font-weight="700" text-anchor="middle">
